                          type: string
                        prerequisitePartNumber:
                          type: string
                      required:
                      - prerequisiteBomItemId
                      - prerequisitePartNumber
                required:
                - id
                - quantity
                - childPartNumber
                - childPartName
                - deletedAt
                - dependencies
              example:
                id: 00000000-0000-0000-0000-000000000000
                quantity: 1
                childPartNumber: DOME-001
                childPartName: Dome
                deletedAt:
                dependencies:
                - prerequisiteBomItemId: 00000000-0000-0000-0000-000000000000
                  prerequisitePartNumber: MUZZLE-001
        '404':
          description: returns 404 when the parent part does not exist
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  code:
                    type: string
                required:
                - error
                - code
              example:
