                          type: array
                          items:
                            type: object
                            properties:
                              prerequisiteBomItemId:
                                type: string
                                nullable: true
                              prerequisitePartNumber:
                                type: string
                                nullable: true
                      required:
                      - id
                      - quantity
                      - childPartNumber
                      - childPartName
                      - deletedAt
                      - dependencies
                required:
                - data
              example:
                data:
                - id: 00000000-0000-0000-0000-000000000000
                  quantity: 2
                  childPartNumber: HORN-LCC-001
                  childPartName: Horn
                  deletedAt: '2026-01-01T00:00:00.000Z'
                  dependencies: []
        '404':
          description: returns 404 when the parent part does not exist
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  code:
                    type: string
