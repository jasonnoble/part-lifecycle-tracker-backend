---
openapi: 3.0.3
info:
  title: Part Lifecycle Tracker API
  version: 0.1.0
  description: Tracks aircraft/engine parts from design through manufacture and test.
    Spec is generated from RSpec request specs (no hand-written DSL).
servers:
- url: http://localhost:3000
paths:
  "/customer-orders":
    get:
      summary: index
      tags:
      - CustomerOrder
      responses:
        '200':
          description: returns a paginated list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        customerName:
                          type: string
                        status:
                          type: string
                        lines:
                          type: array
                          items: {}
                        createdAt:
                          type: string
                          format: date-time
                        updatedAt:
                          type: string
                          format: date-time
                      required:
                      - id
                      - customerName
                      - status
                      - lines
                      - createdAt
                      - updatedAt
                  meta:
                    type: object
                    properties:
                      currentPage:
                        type: integer
                      totalPages:
                        type: integer
                      totalCount:
                        type: integer
                    required:
                    - currentPage
                    - totalPages
                    - totalCount
                required:
                - data
                - meta
              example:
                data:
                - id: 00000000-0000-0000-0000-000000000000
                  customerName: Springfield Taxi Co
                  status: OPEN
                  lines: []
                  createdAt: '2026-01-01T00:00:00.000Z'
                  updatedAt: '2026-01-01T00:00:00.000Z'
                - id: 00000000-0000-0000-0000-000000000000
                  customerName: Powell Motors
                  status: OPEN
                  lines: []
                  createdAt: '2026-01-01T00:00:00.000Z'
                  updatedAt: '2026-01-01T00:00:00.000Z'
                meta:
                  currentPage: 1
                  totalPages: 1
                  totalCount: 2
    post:
      summary: create
      tags:
      - CustomerOrder
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                customerName:
                  type: string
                lines:
                  type: array
                  items:
                    type: object
                    properties:
                      partNumber:
                        type: string
                      quantity:
                        type: integer
                    required:
                    - partNumber
                    - quantity
              required:
              - customerName
              - lines
            example:
              customerName: Powell Motors
              lines:
              - partNumber: THE-HOMER-001
                quantity: 5
      responses:
        '201':
          description: persists the CO and its lines
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  customerName:
                    type: string
                  status:
                    type: string
                  lines:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        quantity:
                          type: integer
                        partNumber:
                          type: string
                        partName:
                          type: string
                      required:
                      - id
                      - quantity
                      - partNumber
                      - partName
                  createdAt:
                    type: string
                    format: date-time
                  updatedAt:
                    type: string
                    format: date-time
                required:
                - id
                - customerName
                - status
                - lines
                - createdAt
                - updatedAt
              example:
                id: 00000000-0000-0000-0000-000000000000
                customerName: Powell Motors
                status: OPEN
                lines:
                - id: 00000000-0000-0000-0000-000000000000
                  quantity: 5
                  partNumber: THE-HOMER-001
                  partName: The Homer
                createdAt: '2026-01-01T00:00:00.000Z'
                updatedAt: '2026-01-01T00:00:00.000Z'
        '422':
          description: does not enqueue any job when validation fails
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  code:
                    type: string
                required:
                - error
                - code
              example:
                error: lines must include at least one line item
                code: VALIDATION_FAILED
  "/customer-orders/{id}":
    get:
      summary: show
      tags:
      - CustomerOrder
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        example: 00000000-0000-0000-0000-000000000000
      responses:
        '200':
          description: returns the CO with its lines including part details
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  customerName:
                    type: string
                  status:
                    type: string
                  lines:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        quantity:
                          type: integer
                        partNumber:
                          type: string
                        partName:
                          type: string
                      required:
                      - id
                      - quantity
                      - partNumber
                      - partName
                  createdAt:
                    type: string
                    format: date-time
                  updatedAt:
                    type: string
                    format: date-time
                required:
                - id
                - customerName
                - status
                - lines
                - createdAt
                - updatedAt
              example:
                id: 00000000-0000-0000-0000-000000000000
                customerName: Powell Motors
                status: OPEN
                lines:
                - id: 00000000-0000-0000-0000-000000000000
                  quantity: 5
                  partNumber: THE-HOMER-001
                  partName: The Homer
                createdAt: '2026-01-01T00:00:00.000Z'
                updatedAt: '2026-01-01T00:00:00.000Z'
        '404':
          description: returns 404 for an unknown id
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  code:
                    type: string
                required:
                - error
                - code
              example:
                error: Couldn't find CustomerOrder with 'id'="00000000-0000-0000-0000-000000000000"
                code: NOT_FOUND
  "/instances":
    get:
      summary: index
      tags:
      - Instance
      responses:
        '200':
          description: combines part_number and status filters
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        serialNumber:
                          type: string
                        currentStatus:
                          type: string
                        partNumber:
                          type: string
                        createdAt:
                          type: string
                          format: date-time
                        updatedAt:
                          type: string
                          format: date-time
                      required:
                      - id
                      - serialNumber
                      - currentStatus
                      - partNumber
                      - createdAt
                      - updatedAt
                  meta:
                    type: object
                    properties:
                      currentPage:
                        type: integer
                      totalPages:
                        type: integer
                      totalCount:
                        type: integer
                    required:
                    - currentPage
                    - totalPages
                    - totalCount
                required:
                - data
                - meta
              example:
                data:
                - id: 00000000-0000-0000-0000-000000000000
                  serialNumber: HMR-0001
                  currentStatus: INSTALLED
                  partNumber: THE-HOMER-001
                  createdAt: '2026-01-01T00:00:00.000Z'
                  updatedAt: '2026-01-01T00:00:00.000Z'
                meta:
                  currentPage: 1
                  totalPages: 1
                  totalCount: 1
      parameters:
      - name: part_number
        in: query
        required: false
        schema:
          type: string
        example: THE-HOMER-001
      - name: status
        in: query
        required: false
        schema:
          type: string
        example: INSTALLED
    post:
      summary: create
      tags:
      - Instance
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                partNumber:
                  type: string
                serialNumber:
                  type: string
              required:
              - partNumber
              - serialNumber
            example:
              partNumber: THE-HOMER-001
              serialNumber: HMR-0001
      responses:
        '201':
          description: creates an instance at RECEIVED with an initial RECEIVED event
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  serialNumber:
                    type: string
                  currentStatus:
                    type: string
                  partNumber:
                    type: string
                  createdAt:
                    type: string
                    format: date-time
                  updatedAt:
                    type: string
                    format: date-time
                required:
                - id
                - serialNumber
                - currentStatus
                - partNumber
                - createdAt
                - updatedAt
              example:
                id: 00000000-0000-0000-0000-000000000000
                serialNumber: HMR-0001
                currentStatus: RECEIVED
                partNumber: THE-HOMER-001
                createdAt: '2026-01-01T00:00:00.000Z'
                updatedAt: '2026-01-01T00:00:00.000Z'
        '403':
          description: rejects writes from a read-only session with 403 READ_ONLY
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  code:
                    type: string
                required:
                - error
                - code
              example:
                error: 'Read-only session: no assigned role for this account'
                code: READ_ONLY
        '422':
          description: returns 422 on duplicate serialNumber
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  code:
                    type: string
                required:
                - error
                - code
              example:
                error: Serial number has already been taken
                code: VALIDATION_FAILED
  "/instances/{instance_serial}/events":
    get:
      summary: index
      tags:
      - Instances::Event
      parameters:
      - name: instance_serial
        in: path
        required: true
        schema:
          type: string
        example: DOES-NOT-EXIST
      responses:
        '200':
          description: returns the event log ordered by occurred_at ASC then id
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        eventType:
                          type: string
                        actor:
                          type: string
                        notes:
                          nullable: true
                        metadata:
                          type: object
                          properties: {}
                        occurredAt:
                          type: string
                          format: date-time
                        recordedAt:
                          type: string
                          format: date-time
                      required:
                      - id
                      - eventType
                      - actor
                      - notes
                      - metadata
                      - occurredAt
                      - recordedAt
                  meta:
                    type: object
                    properties:
                      currentPage:
                        type: integer
                      totalPages:
                        type: integer
                      totalCount:
                        type: integer
                    required:
                    - currentPage
                    - totalPages
                    - totalCount
                required:
                - data
                - meta
              example:
                data:
                - id: 00000000-0000-0000-0000-000000000000
                  eventType: RECEIVED
                  actor: system
                  notes:
                  metadata: {}
                  occurredAt: '2026-01-01T00:00:00.000Z'
                  recordedAt: '2026-01-01T00:00:00.000Z'
                - id: 00000000-0000-0000-0000-000000000000
                  eventType: IN_ASSEMBLY
                  actor: system
                  notes:
                  metadata: {}
                  occurredAt: '2026-01-01T00:00:00.000Z'
                  recordedAt: '2026-01-01T00:00:00.000Z'
                - id: 00000000-0000-0000-0000-000000000000
                  eventType: INSTALLED
                  actor: system
                  notes:
                  metadata: {}
                  occurredAt: '2026-01-01T00:00:00.000Z'
                  recordedAt: '2026-01-01T00:00:00.000Z'
                meta:
                  currentPage: 1
                  totalPages: 1
                  totalCount: 3
        '404':
          description: returns 404 for an unknown serial
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  code:
                    type: string
                required:
                - error
                - code
              example:
                error: Couldn't find PartInstance with [WHERE "part_instances"."serial_number"
                  = $1]
                code: NOT_FOUND
    post:
      summary: create
      tags:
      - Instances::Event
      parameters:
      - name: instance_serial
        in: path
        required: true
        schema:
          type: string
        example: DOES-NOT-EXIST
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                eventType:
                  type: string
                actor:
                  type: string
                notes:
                  type: string
                occurredAt:
                  type: string
                  format: date-time
                metadata:
                  type: object
                  properties:
                    station:
                      type: string
                  required:
                  - station
                recordedAt:
                  type: string
                  format: date-time
              required:
              - eventType
              - occurredAt
            example:
              eventType: INSPECTED
              actor: qa@factory.com
              notes: Started assembly
              occurredAt: '2026-01-01T00:00:00.000Z'
              metadata:
                station: A
              recordedAt: '2026-01-01T00:00:00.000Z'
      responses:
        '201':
          description: sets recorded_at server-side and ignores a client-supplied
            recordedAt
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  eventType:
                    type: string
                  actor:
                    type: string
                  notes:
                    type: string
                    nullable: true
                  metadata:
                    type: object
                    properties:
                      station:
                        type: string
                    required:
                    - station
                    nullable: true
                  occurredAt:
                    type: string
                    format: date-time
                  recordedAt:
                    type: string
                    format: date-time
                required:
                - id
                - eventType
                - actor
                - notes
                - metadata
                - occurredAt
                - recordedAt
              example:
                id: 00000000-0000-0000-0000-000000000000
                eventType: INSPECTED
                actor: jamie.torres@example.com
                notes:
                metadata:
                occurredAt: '2026-01-01T00:00:00.000Z'
                recordedAt: '2026-01-01T00:00:00.000Z'
        '404':
          description: returns 404 for an unknown serial
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  code:
                    type: string
                required:
                - error
                - code
              example:
                error: Couldn't find PartInstance with [WHERE "part_instances"."serial_number"
                  = $1]
                code: NOT_FOUND
        '422':
          description: returns 422 when occurredAt is missing
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  code:
                    type: string
                required:
                - error
                - code
              example:
                error: Occurred at can't be blank
                code: VALIDATION_FAILED
  "/instances/{instance_serial}/tests":
    get:
      summary: index
      tags:
      - Instances::Test
      parameters:
      - name: instance_serial
        in: path
        required: true
        schema:
          type: string
        example: DOES-NOT-EXIST
      responses:
        '200':
          description: returns the test records ordered by occurred_at DESC with camelCase
            records and meta
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        testType:
                          type: string
                        result:
                          type: string
                        notes:
                          nullable: true
                        conductedBy:
                          type: string
                        occurredAt:
                          type: string
                          format: date-time
                        recordedAt:
                          type: string
                          format: date-time
                      required:
                      - id
                      - testType
                      - result
                      - notes
                      - conductedBy
                      - occurredAt
                      - recordedAt
                  meta:
                    type: object
                    properties:
                      currentPage:
                        type: integer
                      totalPages:
                        type: integer
                      totalCount:
                        type: integer
                    required:
                    - currentPage
                    - totalPages
                    - totalCount
                required:
                - data
                - meta
              example:
                data:
                - id: 00000000-0000-0000-0000-000000000000
                  testType: THIRD
                  result: PASS
                  notes:
                  conductedBy: qa@factory.com
                  occurredAt: '2026-01-01T00:00:00.000Z'
                  recordedAt: '2026-01-01T00:00:00.000Z'
                - id: 00000000-0000-0000-0000-000000000000
                  testType: SECOND
                  result: PASS
                  notes:
                  conductedBy: qa@factory.com
                  occurredAt: '2026-01-01T00:00:00.000Z'
                  recordedAt: '2026-01-01T00:00:00.000Z'
                - id: 00000000-0000-0000-0000-000000000000
                  testType: FIRST
                  result: PASS
                  notes:
                  conductedBy: qa@factory.com
                  occurredAt: '2026-01-01T00:00:00.000Z'
                  recordedAt: '2026-01-01T00:00:00.000Z'
                meta:
                  currentPage: 1
                  totalPages: 1
                  totalCount: 3
        '404':
          description: returns 404 for an unknown serial
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  code:
                    type: string
                required:
                - error
                - code
              example:
                error: Couldn't find PartInstance with [WHERE "part_instances"."serial_number"
                  = $1]
                code: NOT_FOUND
    post:
      summary: create
      tags:
      - Instances::Test
      parameters:
      - name: instance_serial
        in: path
        required: true
        schema:
          type: string
        example: DOES-NOT-EXIST
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                testType:
                  type: string
                result:
                  type: string
                notes:
                  type: string
                conductedBy:
                  type: string
                occurredAt:
                  type: string
                  format: date-time
                recordedAt:
                  type: string
                  format: date-time
              required:
              - testType
              - result
              - occurredAt
            example:
              testType: HORN_SEQUENCE
              result: PASS
              notes: All 7 bars played
              conductedBy: qa@factory.com
              occurredAt: '2026-01-01T00:00:00.000Z'
              recordedAt: '2026-01-01T00:00:00.000Z'
      responses:
        '201':
          description: sets recorded_at server-side and ignores a client-supplied
            recordedAt
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  testType:
                    type: string
                  result:
                    type: string
                  notes:
                    type: string
                    nullable: true
                  conductedBy:
                    type: string
                  occurredAt:
                    type: string
                    format: date-time
                  recordedAt:
                    type: string
                    format: date-time
                required:
                - id
                - testType
                - result
                - notes
                - conductedBy
                - occurredAt
                - recordedAt
              example:
                id: 00000000-0000-0000-0000-000000000000
                testType: HORN_SEQUENCE
                result: PASS
                notes:
                conductedBy: dr.quinn@example.com
                occurredAt: '2026-01-01T00:00:00.000Z'
                recordedAt: '2026-01-01T00:00:00.000Z'
        '404':
          description: returns 404 for an unknown serial
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  code:
                    type: string
                required:
                - error
                - code
              example:
                error: Couldn't find PartInstance with [WHERE "part_instances"."serial_number"
                  = $1]
                code: NOT_FOUND
        '422':
          description: returns 422 when a required field is missing
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  code:
                    type: string
                required:
                - error
                - code
              example:
                error: Test type can't be blank
                code: VALIDATION_FAILED
  "/instances/{serial}":
    get:
      summary: show
      tags:
      - Instance
      parameters:
      - name: serial
        in: path
        required: true
        schema:
          type: string
        example: DOES-NOT-EXIST
      responses:
        '200':
          description: returns the instance with derived current_status
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  serialNumber:
                    type: string
                  currentStatus:
                    type: string
                  partNumber:
                    type: string
                  createdAt:
                    type: string
                    format: date-time
                  updatedAt:
                    type: string
                    format: date-time
                required:
                - id
                - serialNumber
                - currentStatus
                - partNumber
                - createdAt
                - updatedAt
              example:
                id: 00000000-0000-0000-0000-000000000000
                serialNumber: HMR-0001
                currentStatus: INSTALLED
                partNumber: THE-HOMER-001
                createdAt: '2026-01-01T00:00:00.000Z'
                updatedAt: '2026-01-01T00:00:00.000Z'
        '404':
          description: returns 404 for an unknown serial
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  code:
                    type: string
                required:
                - error
                - code
              example:
                error: Couldn't find PartInstance with [WHERE "part_instances"."serial_number"
                  = $1]
                code: NOT_FOUND
  "/me":
    get:
      summary: show
      tags:
      - Me
      responses:
        '200':
          description: authenticates as read-only / no-role (null identity, not 401)
          content:
            application/json:
              schema:
                type: object
                properties:
                  email:
                    type: string
                    nullable: true
                  name:
                    type: string
                    nullable: true
                  role:
                    type: string
                    nullable: true
                  permissions:
                    type: array
                    items:
                      type: string
                required:
                - email
                - name
                - role
              example:
                email:
                name:
                role:
                permissions: []
        '401':
          description: returns 401 when the session token is invalid or expired
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  code:
                    type: string
                required:
                - error
                - code
              example:
                error: Authentication required
                code: UNAUTHENTICATED
  "/parts":
    get:
      summary: index
      tags:
      - Part
      responses:
        '200':
          description: returns an empty data array with meta when there are no parts
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        partNumber:
                          type: string
                        name:
                          type: string
                        description:
                          type: string
                        revision:
                          type: string
                        status:
                          type: string
                        createdAt:
                          type: string
                          format: date-time
                        updatedAt:
                          type: string
                          format: date-time
                      required:
                      - id
                      - partNumber
                      - name
                      - description
                      - revision
                      - status
                      - createdAt
                      - updatedAt
                  meta:
                    type: object
                    properties:
                      currentPage:
                        type: integer
                      totalPages:
                        type: integer
                      totalCount:
                        type: integer
                    required:
                    - currentPage
                    - totalPages
                    - totalCount
                required:
                - data
                - meta
              example:
                data: []
                meta:
                  currentPage: 1
                  totalPages: 1
                  totalCount: 0
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
        example: 2
      - name: page
        in: query
        required: false
        schema:
          type: integer
        example: 2
      - name: search
        in: query
        required: false
        schema:
          type: string
        example: homer
      - name: status
        in: query
        required: false
        schema:
          type: string
        example: RELEASED
    post:
      summary: create
      tags:
      - Part
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                part_number:
                  type: string
                name:
                  type: string
                description:
                  type: string
                revision:
                  type: string
              required:
              - part_number
              - name
              - description
              - revision
            example:
              part_number: NEW-001
              name: New Part
              description: desc
              revision: A
      responses:
