  "/parts/{part_number}/status":
    post:
      summary: update_status
      tags:
      - Part
      parameters:
      - name: part_number
        in: path
        required: true
        schema:
          type: string
        example: NOPE-999
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                status:
                  type: string
              required:
              - status
            example:
              status: OBSOLETE
      responses:
        '200':
          description: transitions DRAFT -> OBSOLETE with 200
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  partNumber:
                    type: string
                  name:
                    type: string
                  description:
                    type: string
                  revision:
                    type: string
                  status:
                    type: string
                  createdAt:
                    type: string
                    format: date-time
                  updatedAt:
                    type: string
                    format: date-time
                required:
                - id
                - partNumber
                - name
                - description
                - revision
                - status
                - createdAt
                - updatedAt
              example:
                id: 00000000-0000-0000-0000-000000000000
                partNumber: ST-003
                name: Obsoletable Part
                description: A part definition for testing.
                revision: A
                status: OBSOLETE
                createdAt: '2026-01-01T00:00:00.000Z'
                updatedAt: '2026-01-01T00:00:00.000Z'
        '404':
          description: returns 404 NOT_FOUND for a missing part
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  code:
                    type: string
                required:
                - error
                - code
              example:
                error: Couldn't find PartDefinition with [WHERE "part_definitions"."part_number"
                  = $1]
                code: NOT_FOUND
        '422':
          description: rejects an unrecognized status string with 422 INVALID_TRANSITION
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  code:
                    type: string
                required:
                - error
                - code
              example:
                error: Cannot transition from DRAFT to BOGUS
                code: INVALID_TRANSITION
