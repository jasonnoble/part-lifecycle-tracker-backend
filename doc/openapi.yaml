---
openapi: 3.0.3
info:
  title: Part Lifecycle Tracker API
  version: 0.1.0
  description: Tracks aircraft/engine parts from design through manufacture and test.
    Spec is generated from RSpec request specs (no hand-written DSL).
servers:
- url: http://localhost:3000
paths:
  "/instances":
    get:
      summary: index
      tags:
      - Instance
      responses:
        '200':
          description: combines part_number and status filters
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        serialNumber:
                          type: string
                        currentStatus:
                          type: string
                        partNumber:
                          type: string
                        createdAt:
                          type: string
                          format: date-time
                        updatedAt:
                          type: string
                          format: date-time
                      required:
                      - id
                      - serialNumber
                      - currentStatus
                      - partNumber
                      - createdAt
                      - updatedAt
                  meta:
                    type: object
                    properties:
                      currentPage:
                        type: integer
                      totalPages:
                        type: integer
                      totalCount:
                        type: integer
                    required:
                    - currentPage
                    - totalPages
                    - totalCount
                required:
                - data
                - meta
              example:
                data:
                - id: 00000000-0000-0000-0000-000000000000
                  serialNumber: HMR-0001
                  currentStatus: INSTALLED
                  partNumber: THE-HOMER-001
                  createdAt: '2026-01-01T00:00:00.000Z'
                  updatedAt: '2026-01-01T00:00:00.000Z'
                meta:
                  currentPage: 1
                  totalPages: 1
                  totalCount: 1
      parameters:
      - name: part_number
        in: query
        required: false
        schema:
          type: string
        example: THE-HOMER-001
      - name: status
        in: query
        required: false
        schema:
          type: string
        example: INSTALLED
    post:
      summary: create
      tags:
      - Instance
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                partNumber:
                  type: string
                serialNumber:
                  type: string
              required:
              - partNumber
              - serialNumber
            example:
              partNumber: THE-HOMER-001
              serialNumber: HMR-0001
      responses:
        '201':
          description: creates an instance at RECEIVED with an initial RECEIVED event
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  serialNumber:
                    type: string
                  currentStatus:
                    type: string
                  partNumber:
                    type: string
                  createdAt:
                    type: string
                    format: date-time
                  updatedAt:
                    type: string
                    format: date-time
                required:
                - id
                - serialNumber
                - currentStatus
                - partNumber
                - createdAt
                - updatedAt
              example:
                id: 00000000-0000-0000-0000-000000000000
                serialNumber: HMR-0001
                currentStatus: RECEIVED
                partNumber: THE-HOMER-001
                createdAt: '2026-01-01T00:00:00.000Z'
                updatedAt: '2026-01-01T00:00:00.000Z'
        '422':
          description: returns 422 on duplicate serialNumber
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  code:
                    type: string
                required:
                - error
                - code
              example:
                error: Serial number has already been taken
                code: VALIDATION_FAILED
  "/instances/{instance_serial}/events":
    get:
      summary: index
      tags:
      - Instances::Event
      parameters:
      - name: instance_serial
        in: path
        required: true
        schema:
          type: string
        example: DOES-NOT-EXIST
      responses:
        '200':
          description: returns the event log ordered by occurred_at ASC then id
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        eventType:
                          type: string
                        actor:
                          type: string
                        notes:
                          nullable: true
                        metadata:
                          type: object
                          properties: {}
                        occurredAt:
                          type: string
                          format: date-time
                        recordedAt:
                          type: string
                          format: date-time
                      required:
                      - id
                      - eventType
                      - actor
                      - notes
                      - metadata
                      - occurredAt
                      - recordedAt
                  meta:
                    type: object
                    properties:
                      currentPage:
                        type: integer
                      totalPages:
                        type: integer
                      totalCount:
                        type: integer
                    required:
                    - currentPage
                    - totalPages
                    - totalCount
                required:
                - data
                - meta
              example:
                data:
                - id: 00000000-0000-0000-0000-000000000000
                  eventType: RECEIVED
                  actor: system
                  notes:
                  metadata: {}
                  occurredAt: '2026-01-01T00:00:00.000Z'
                  recordedAt: '2026-01-01T00:00:00.000Z'
                - id: 00000000-0000-0000-0000-000000000000
                  eventType: IN_ASSEMBLY
                  actor: system
                  notes:
                  metadata: {}
                  occurredAt: '2026-01-01T00:00:00.000Z'
                  recordedAt: '2026-01-01T00:00:00.000Z'
                - id: 00000000-0000-0000-0000-000000000000
                  eventType: INSTALLED
                  actor: system
                  notes:
                  metadata: {}
                  occurredAt: '2026-01-01T00:00:00.000Z'
                  recordedAt: '2026-01-01T00:00:00.000Z'
                meta:
                  currentPage: 1
                  totalPages: 1
                  totalCount: 3
        '404':
          description: returns 404 for an unknown serial
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  code:
                    type: string
                required:
                - error
                - code
              example:
                error: Couldn't find PartInstance with [WHERE "part_instances"."serial_number"
                  = $1]
                code: NOT_FOUND
    post:
      summary: create
      tags:
      - Instances::Event
      parameters:
      - name: instance_serial
        in: path
        required: true
        schema:
          type: string
        example: DOES-NOT-EXIST
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                eventType:
                  type: string
                actor:
                  type: string
                notes:
                  type: string
                occurredAt:
                  type: string
                  format: date-time
                metadata:
                  type: object
                  properties:
                    station:
                      type: string
                  required:
                  - station
                recordedAt:
                  type: string
                  format: date-time
              required:
              - eventType
              - actor
              - occurredAt
            example:
              eventType: INSPECTED
              actor: qa@factory.com
              notes: Started assembly
              occurredAt: '2026-01-01T00:00:00.000Z'
              metadata:
                station: A
              recordedAt: '2026-01-01T00:00:00.000Z'
      responses:
        '201':
          description: sets recorded_at server-side and ignores a client-supplied
            recordedAt
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  eventType:
                    type: string
                  actor:
                    type: string
                  notes:
                    type: string
                    nullable: true
                  metadata:
                    type: object
                    properties:
                      station:
                        type: string
                    required:
                    - station
                    nullable: true
                  occurredAt:
                    type: string
                    format: date-time
                  recordedAt:
                    type: string
                    format: date-time
                required:
                - id
                - eventType
                - actor
                - notes
                - metadata
                - occurredAt
                - recordedAt
              example:
                id: 00000000-0000-0000-0000-000000000000
                eventType: INSPECTED
                actor: qa@factory.com
                notes:
                metadata:
                occurredAt: '2026-01-01T00:00:00.000Z'
                recordedAt: '2026-01-01T00:00:00.000Z'
        '404':
          description: returns 404 for an unknown serial
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  code:
                    type: string
                required:
                - error
                - code
              example:
                error: Couldn't find PartInstance with [WHERE "part_instances"."serial_number"
                  = $1]
                code: NOT_FOUND
        '422':
          description: returns 422 when occurredAt is missing
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  code:
                    type: string
                required:
                - error
                - code
              example:
                error: Occurred at can't be blank
                code: VALIDATION_FAILED
  "/instances/{instance_serial}/tests":
    get:
      summary: index
      tags:
      - Instances::Test
      parameters:
      - name: instance_serial
        in: path
        required: true
        schema:
          type: string
        example: DOES-NOT-EXIST
      responses:
        '200':
          description: returns the test records ordered by occurred_at DESC with camelCase
            records and meta
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        testType:
                          type: string
                        result:
                          type: string
                        notes:
                          nullable: true
                        conductedBy:
                          type: string
                        occurredAt:
                          type: string
                          format: date-time
                        recordedAt:
                          type: string
                          format: date-time
                      required:
                      - id
                      - testType
                      - result
                      - notes
                      - conductedBy
                      - occurredAt
                      - recordedAt
                  meta:
                    type: object
                    properties:
                      currentPage:
                        type: integer
                      totalPages:
                        type: integer
                      totalCount:
                        type: integer
                    required:
                    - currentPage
                    - totalPages
                    - totalCount
                required:
                - data
                - meta
              example:
                data:
                - id: 00000000-0000-0000-0000-000000000000
                  testType: THIRD
                  result: PASS
                  notes:
                  conductedBy: qa@factory.com
                  occurredAt: '2026-01-01T00:00:00.000Z'
                  recordedAt: '2026-01-01T00:00:00.000Z'
                - id: 00000000-0000-0000-0000-000000000000
                  testType: SECOND
                  result: PASS
                  notes:
                  conductedBy: qa@factory.com
                  occurredAt: '2026-01-01T00:00:00.000Z'
                  recordedAt: '2026-01-01T00:00:00.000Z'
                - id: 00000000-0000-0000-0000-000000000000
                  testType: FIRST
                  result: PASS
                  notes:
                  conductedBy: qa@factory.com
                  occurredAt: '2026-01-01T00:00:00.000Z'
                  recordedAt: '2026-01-01T00:00:00.000Z'
                meta:
                  currentPage: 1
                  totalPages: 1
                  totalCount: 3
        '404':
          description: returns 404 for an unknown serial
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  code:
                    type: string
                required:
                - error
                - code
              example:
                error: Couldn't find PartInstance with [WHERE "part_instances"."serial_number"
                  = $1]
                code: NOT_FOUND
    post:
      summary: create
      tags:
      - Instances::Test
      parameters:
      - name: instance_serial
        in: path
        required: true
        schema:
          type: string
        example: DOES-NOT-EXIST
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                testType:
                  type: string
                result:
                  type: string
                notes:
                  type: string
                conductedBy:
                  type: string
                occurredAt:
                  type: string
                  format: date-time
                recordedAt:
                  type: string
                  format: date-time
              required:
              - testType
              - result
              - conductedBy
              - occurredAt
            example:
              testType: HORN_SEQUENCE
              result: PASS
              notes: All 7 bars played
              conductedBy: qa@factory.com
              occurredAt: '2026-01-01T00:00:00.000Z'
              recordedAt: '2026-01-01T00:00:00.000Z'
      responses:
        '201':
          description: sets recorded_at server-side and ignores a client-supplied
            recordedAt
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  testType:
                    type: string
                  result:
                    type: string
                  notes:
                    type: string
                    nullable: true
                  conductedBy:
                    type: string
                  occurredAt:
                    type: string
                    format: date-time
                  recordedAt:
                    type: string
                    format: date-time
                required:
                - id
                - testType
                - result
                - notes
                - conductedBy
                - occurredAt
                - recordedAt
              example:
                id: 00000000-0000-0000-0000-000000000000
                testType: HORN_SEQUENCE
                result: PASS
                notes:
                conductedBy: qa@factory.com
                occurredAt: '2026-01-01T00:00:00.000Z'
                recordedAt: '2026-01-01T00:00:00.000Z'
        '404':
          description: returns 404 for an unknown serial
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  code:
                    type: string
                required:
                - error
                - code
              example:
                error: Couldn't find PartInstance with [WHERE "part_instances"."serial_number"
                  = $1]
                code: NOT_FOUND
        '422':
          description: returns 422 when a required field is missing
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  code:
                    type: string
                required:
                - error
                - code
              example:
                error: Test type can't be blank
                code: VALIDATION_FAILED
  "/instances/{serial}":
    get:
      summary: show
      tags:
      - Instance
      parameters:
      - name: serial
        in: path
        required: true
        schema:
          type: string
        example: DOES-NOT-EXIST
      responses:
        '200':
          description: returns the instance with derived current_status
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  serialNumber:
                    type: string
                  currentStatus:
                    type: string
                  partNumber:
                    type: string
                  createdAt:
                    type: string
                    format: date-time
                  updatedAt:
                    type: string
                    format: date-time
                required:
                - id
                - serialNumber
                - currentStatus
                - partNumber
                - createdAt
                - updatedAt
              example:
                id: 00000000-0000-0000-0000-000000000000
                serialNumber: HMR-0001
                currentStatus: INSTALLED
                partNumber: THE-HOMER-001
                createdAt: '2026-01-01T00:00:00.000Z'
                updatedAt: '2026-01-01T00:00:00.000Z'
        '404':
          description: returns 404 for an unknown serial
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  code:
                    type: string
                required:
                - error
                - code
              example:
                error: Couldn't find PartInstance with [WHERE "part_instances"."serial_number"
                  = $1]
                code: NOT_FOUND
  "/parts":
    get:
      summary: index
      tags:
      - Part
      responses:
        '200':
          description: returns an empty data array with meta when there are no parts
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        partNumber:
                          type: string
                        name:
                          type: string
                        description:
                          type: string
                        revision:
                          type: string
                        status:
                          type: string
                        createdAt:
                          type: string
                          format: date-time
                        updatedAt:
                          type: string
                          format: date-time
                      required:
                      - id
                      - partNumber
                      - name
                      - description
                      - revision
                      - status
                      - createdAt
                      - updatedAt
                  meta:
                    type: object
                    properties:
                      currentPage:
                        type: integer
                      totalPages:
                        type: integer
                      totalCount:
                        type: integer
                    required:
                    - currentPage
                    - totalPages
                    - totalCount
                required:
                - data
                - meta
              example:
                data: []
                meta:
                  currentPage: 1
                  totalPages: 1
                  totalCount: 0
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
        example: 2
      - name: page
        in: query
        required: false
        schema:
          type: integer
        example: 2
      - name: search
        in: query
        required: false
        schema:
          type: string
        example: homer
      - name: status
        in: query
        required: false
        schema:
          type: string
        example: RELEASED
    post:
      summary: create
      tags:
      - Part
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                part_number:
                  type: string
                name:
                  type: string
                description:
                  type: string
                revision:
                  type: string
              required:
              - part_number
              - name
              - description
              - revision
            example:
              part_number: NEW-001
              name: New Part
              description: desc
              revision: A
      responses:
        '201':
          description: creates a part and returns 201 with the record
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  partNumber:
                    type: string
                  name:
                    type: string
                  description:
                    type: string
                  revision:
                    type: string
                  status:
                    type: string
                  createdAt:
                    type: string
                    format: date-time
                  updatedAt:
                    type: string
                    format: date-time
                required:
                - id
                - partNumber
                - name
                - description
                - revision
                - status
                - createdAt
                - updatedAt
              example:
                id: 00000000-0000-0000-0000-000000000000
                partNumber: NEW-001
                name: New Part
                description: desc
                revision: A
                status: DRAFT
                createdAt: '2026-01-01T00:00:00.000Z'
                updatedAt: '2026-01-01T00:00:00.000Z'
        '422':
          description: returns 422 on duplicate part_number
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  code:
                    type: string
                required:
                - error
                - code
              example:
                error: Part number has already been taken
                code: VALIDATION_FAILED
  "/parts/{part_number}":
    get:
      summary: show
      tags:
      - Part
      parameters:
      - name: part_number
        in: path
        required: true
        schema:
          type: string
        example: DOES-NOT-EXIST
      responses:
        '200':
          description: returns the part by part_number
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  partNumber:
                    type: string
                  name:
                    type: string
                  description:
                    type: string
                  revision:
                    type: string
                  status:
                    type: string
                  createdAt:
                    type: string
                    format: date-time
                  updatedAt:
                    type: string
                    format: date-time
                required:
                - id
                - partNumber
                - name
                - description
                - revision
                - status
                - createdAt
                - updatedAt
              example:
                id: 00000000-0000-0000-0000-000000000000
                partNumber: FIND-001
                name: Findable
                description: A part definition for testing.
                revision: A
                status: DRAFT
                createdAt: '2026-01-01T00:00:00.000Z'
                updatedAt: '2026-01-01T00:00:00.000Z'
        '404':
          description: returns 404 with error shape when not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  code:
                    type: string
                required:
                - error
                - code
              example:
                error: Couldn't find PartDefinition with [WHERE "part_definitions"."part_number"
                  = $1]
                code: NOT_FOUND
    patch:
      summary: update
      tags:
      - Part
      parameters:
      - name: part_number
        in: path
        required: true
        schema:
          type: string
        example: NOPE-001
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                revision:
                  type: string
                status:
                  type: string
            example:
              name: Renamed
              description: New desc
              revision: B
              status: RELEASED
      responses:
        '200':
          description: ignores a status param without erroring
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  partNumber:
                    type: string
                  name:
                    type: string
                  description:
                    type: string
                  revision:
                    type: string
                  status:
                    type: string
                  createdAt:
                    type: string
                    format: date-time
                  updatedAt:
                    type: string
                    format: date-time
                required:
                - id
                - partNumber
                - name
                - description
                - revision
                - status
                - createdAt
                - updatedAt
              example:
                id: 00000000-0000-0000-0000-000000000000
                partNumber: UPD-004
                name: Renamed
                description: A part definition for testing.
                revision: A
                status: DRAFT
                createdAt: '2026-01-01T00:00:00.000Z'
                updatedAt: '2026-01-01T00:00:00.000Z'
        '404':
          description: returns 404 when the part does not exist
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  code:
                    type: string
                required:
                - error
                - code
              example:
                error: Couldn't find PartDefinition with [WHERE "part_definitions"."part_number"
                  = $1]
                code: NOT_FOUND
        '422':
          description: returns 422 REVISION_LOCKED when changing revision on a non-DRAFT
            part
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  code:
                    type: string
                required:
                - error
                - code
              example:
                error: Revision cannot be changed on a non-draft part
                code: REVISION_LOCKED
  "/parts/{part_number}/bom":
    get:
      summary: index
      tags:
      - BomItem
      parameters:
      - name: part_number
        in: path
        required: true
        schema:
          type: string
        example: ASSY-001
      responses:
        '200':
          description: soft deletes and the item still appears in a subsequent GET
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        quantity:
                          type: integer
                        childPartNumber:
                          type: string
                        childPartName:
                          type: string
                        deletedAt:
                          type: string
                          format: date-time
                        dependencies:
                          type: array
                          items:
                            type: object
                            properties:
                              prerequisiteBomItemId:
                                type: string
                                nullable: true
                              prerequisitePartNumber:
                                type: string
                                nullable: true
                      required:
                      - id
                      - quantity
                      - childPartNumber
                      - childPartName
                      - deletedAt
                      - dependencies
                required:
                - data
              example:
                data:
                - id: 00000000-0000-0000-0000-000000000000
                  quantity: 2
                  childPartNumber: HORN-LCC-001
                  childPartName: Horn
                  deletedAt: '2026-01-01T00:00:00.000Z'
                  dependencies: []
        '404':
          description: returns 404 when the parent part does not exist
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  code:
                    type: string
                required:
                - error
                - code
              example:
                error: Couldn't find PartDefinition with [WHERE "part_definitions"."part_number"
                  = $1]
                code: NOT_FOUND
    post:
      summary: create
      tags:
      - BomItem
      parameters:
      - name: part_number
        in: path
        required: true
        schema:
          type: string
        example: NOPE-001
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                childPartNumber:
                  type: string
                quantity:
                  type: string
                prerequisites:
                  type: array
                  items:
                    type: string
              required:
              - childPartNumber
              - quantity
            example:
              childPartNumber: DOME-001
              quantity: '1'
              prerequisites:
              - 00000000-0000-0000-0000-000000000000
      responses:
        '201':
          description: embeds dependencies when prerequisites are passed
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  quantity:
                    type: integer
                  childPartNumber:
                    type: string
                  childPartName:
                    type: string
                  deletedAt:
                    type: string
                    format: date-time
                  dependencies:
                    type: array
                    items:
                      type: object
                      properties:
                        prerequisiteBomItemId:
                          type: string
                        prerequisitePartNumber:
                          type: string
                      required:
                      - prerequisiteBomItemId
                      - prerequisitePartNumber
                required:
                - id
                - quantity
                - childPartNumber
                - childPartName
                - deletedAt
                - dependencies
              example:
                id: 00000000-0000-0000-0000-000000000000
                quantity: 1
                childPartNumber: DOME-001
                childPartName: Dome
                deletedAt:
                dependencies:
                - prerequisiteBomItemId: 00000000-0000-0000-0000-000000000000
                  prerequisitePartNumber: MUZZLE-001
        '404':
          description: returns 404 when the parent part does not exist
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  code:
                    type: string
                required:
                - error
                - code
              example:
                error: Couldn't find PartDefinition with [WHERE "part_definitions"."part_number"
                  = $1]
                code: NOT_FOUND
        '422':
          description: returns 422 CHILD_NOT_FOUND when childPartNumber does not exist
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  code:
                    type: string
                required:
                - error
                - code
              example:
                error: Child part not found
                code: CHILD_NOT_FOUND
