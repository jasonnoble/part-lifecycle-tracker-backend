      summary: create
      tags:
      - BomItem
      parameters:
      - name: part_number
        in: path
        required: true
        schema:
          type: string
        example: NOPE-001
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                childPartNumber:
                  type: string
                quantity:
                  type: string
                prerequisites:
                  type: array
                  items:
                    type: string
              required:
              - childPartNumber
              - quantity
            example:
              childPartNumber: DOME-001
              quantity: '1'
              prerequisites:
              - 00000000-0000-0000-0000-000000000000
      responses:
        '201':
          description: embeds dependencies when prerequisites are passed
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  quantity:
                    type: integer
                  childPartNumber:
                    type: string
                  childPartName:
                    type: string
                  deletedAt:
                    type: string
                    format: date-time
                  dependencies:
