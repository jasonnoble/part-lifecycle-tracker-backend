name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  scan_ruby:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager
      
      - name: Scan for known security vulnerabilities in gems used
        run: bin/bundler-audit
      
  lint:
    runs-on: ubuntu-latest
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Prepare RuboCop cache
        uses: actions/cache@v5
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint code for consistent style
        run: bin/rubocop -f github
  rspec:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:13
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: part_lifecycle_tracker_test
          POSTGRES_PASSWORD: postgres
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/part_lifecycle_tracker_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          # undercover diffs against the PR base branch and needs full git history
          # (a shallow clone breaks --compare).
          fetch-depth: 0

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Setup Database
        run: bin/rails db:create db:migrate
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/part_lifecycle_tracker_test

      - name: Run tests and regenerate OpenAPI doc
        run: OPENAPI=1 bundle exec rspec
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/part_lifecycle_tracker_test

      - name: Verify the committed OpenAPI doc is up to date
        run: |
          git diff --exit-code doc/openapi.yaml || {
            echo "::error::doc/openapi.yaml is out of date. Run 'OPENAPI=1 bundle exec rspec' and commit the result."
            exit 1
          }

      # Diff-coverage gate: fails the build when changed code in this PR is not
      # covered. Compares to the PR base branch (correct for stacked PRs); reads
      # coverage/coverage.json produced by the rspec step above. PR-only.
      - name: Coverage gate (undercover)
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin "${{ github.base_ref }}"
          bundle exec undercover --compare "origin/${{ github.base_ref }}"
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/part_lifecycle_tracker_test
